<div
  #stageEl
  class="video-stage"
  [class.is-active]="active()"
  [class.is-grid]="isGrid()"
  [class.has-pinned]="!!pinnedKey()"
>
  @if (participants().length === 0) {
    <div class="stage-empty">
      <p>Video of the people who join will appear here</p>
    </div>
  }

  @for (tile of tiles(); track tile.key) {
    @if (tile.link; as link) {
      <video-tile
        [class.main]="!isGrid()"
        [class.is-pinned]="pinnedKey() === tile.key"
        [style.grid-column]="gridColumn(tile.key)"
        [style.order]="pinnedKey() === tile.key ? -1 : null"
        [attr.tabindex]="isGrid() ? 0 : null"
        [attr.role]="isGrid() ? 'button' : null"
        [attr.aria-pressed]="isGrid() ? pinnedKey() === tile.key : null"
        [attr.aria-label]="isGrid() ? 'Pin ' + link.name() : null"
        [name]="link.name()"
        [video]="link.video()"
        [audio]="link.audio()"
        [isVideoOn]="link.media().cam || link.media().screen"
        [isMicOn]="link.media().mic"
        [isScreen]="link.media().screen"
        [status]="link.status()"
        [audible]="active()"
        [volume]="volumeOf(link)"
        [speakerId]="speakerId()"
        [levelStream]="link.audio()"
        (click)="togglePin(tile.key)"
        (keydown.enter)="togglePin(tile.key)"
      />
    } @else {
      <video-tile
        [class.pip]="!isGrid()"
        [class.is-pinned]="pinnedKey() === tile.key"
        [style.grid-column]="gridColumn(tile.key)"
        [style.order]="pinnedKey() === tile.key ? -1 : null"
        [attr.tabindex]="isGrid() ? 0 : null"
        [attr.role]="isGrid() ? 'button' : null"
        [attr.aria-pressed]="isGrid() ? pinnedKey() === tile.key : null"
        [attr.aria-label]="isGrid() ? 'Pin your video' : null"
        [isSelf]="true"
        [name]="myName()"
        [video]="localStream()"
        [isVideoOn]="isCamEnabled() || isSharingScreen()"
        [isMicOn]="isMicEnabled()"
        [isScreen]="isSharingScreen()"
        [levelStream]="isMicEnabled() ? microphoneStream() : undefined"
        (click)="togglePin(tile.key)"
        (keydown.enter)="togglePin(tile.key)"
      />
    }
  }

  @if (canFullscreen) {
    <button
      type="button"
      class="fullscreen-toggle"
      [attr.aria-label]="isFullscreen() ? 'Exit fullscreen' : 'Enter fullscreen'"
      [title]="isFullscreen() ? 'Exit fullscreen' : 'Enter fullscreen'"
      (click)="toggleFullscreen()"
    >
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        @if (isFullscreen()) {
          <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" />
        } @else {
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
        }
      </svg>
    </button>
  }
</div>
