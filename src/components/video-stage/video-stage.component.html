<div #stageEl class="video-stage" [class.is-active]="active()">
  <video
    #remoteVideoEl
    class="remote-video"
    [class.is-screen]="remoteMedia().screen"
    autoplay
    playsinline
    [muted]="true"
  ></video>
  @if (!remoteVideo()) {
    <p class="stage-placeholder">Your peer's video will appear here</p>
  } @else if (!isRemoteVideoOn()) {
    <p class="stage-placeholder">Your peer's camera is off</p>
  }

  @if (remoteVideo() && !remoteMedia().mic) {
    <span class="stage-badge">Peer's mic is off</span>
  }

  @if (canFullscreen) {
    <button
      type="button"
      class="fullscreen-toggle"
      [attr.aria-label]="isFullscreen() ? 'Exit fullscreen' : 'Enter fullscreen'"
      [title]="isFullscreen() ? 'Exit fullscreen' : 'Enter fullscreen'"
      (click)="toggleFullscreen()"
    >
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        @if (isFullscreen()) {
          <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" />
        } @else {
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
        }
      </svg>
    </button>
  }

  <div class="local-preview">
    <video #localVideoEl [class.is-screen]="isSharingScreen()" autoplay playsinline [muted]="true"></video>
    @if (!isCamEnabled() && !isSharingScreen()) {
      <span class="preview-placeholder">Camera off</span>
    }
  </div>

  <audio #remoteAudioEl autoplay [muted]="!active()"></audio>
</div>
