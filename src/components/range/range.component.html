<label class="range-container">
    <span class="range-caption">
        <span>{{ label() }}</span>
        <span class="value-display">{{ percentage() }}%</span>
    </span>
    <input
        type="range"
        [min]="min()"
        [max]="max()"
        [step]="step()"
        [value]="current()"
        (input)="onInput($event)"
        (change)="onChange($event)"
        [style.background-size]="backgroundSize()"
        class="neo-range"
    >
</label>
