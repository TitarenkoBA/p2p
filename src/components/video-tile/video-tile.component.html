<video
  #videoEl
  [class.is-screen]="isScreen()"
  [class.is-mirrored]="isSelf() && !isScreen()"
  autoplay
  playsinline
  [muted]="true"
></video>
@if (placeholder(); as text) {
  <p class="tile-placeholder">{{ text }}</p>
}

<span class="tile-name">
  {{ name() }}
  @if (!isMicOn()) {
    <svg class="mic-off" viewBox="0 0 24 24" width="14" height="14" role="img" aria-label="Microphone off">
      <path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 10V5a3 3 0 0 0-5.7-1.3M5 11a7 7 0 0 0 11.6 5.3M19 11a7 7 0 0 1-.5 2.6M12 18v3M3 3l18 18" />
    </svg>
  }
</span>

@if (!isSelf()) {
  <audio #audioEl autoplay [muted]="!audible()"></audio>
}
